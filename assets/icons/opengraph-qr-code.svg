<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    QR Code Generator
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="36" fill="#e0e7ff" text-anchor="middle">
    Generate QR codes instantly
  </text>
  
  <!-- QR Code Icon -->
  <g transform="translate(600, 400)">
    <!-- QR Code squares -->
    <rect x="-80" y="-80" width="60" height="60" fill="white"/>
    <rect x="-80" y="-80" width="48" height="48" fill="#1f2937" opacity="0.9"/>
    <rect x="-80" y="20" width="60" height="60" fill="white"/>
    <rect x="-80" y="20" width="48" height="48" fill="#1f2937" opacity="0.9"/>
    <rect x="20" y="-80" width="60" height="60" fill="white"/>
    <rect x="20" y="-80" width="48" height="48" fill="#1f2937" opacity="0.9"/>
    
    <!-- Decorative QR pattern -->
    <rect x="-30" y="-30" width="12" height="12" fill="#3b82f6" opacity="0.6"/>
    <rect x="0" y="-30" width="12" height="12" fill="#3b82f6" opacity="0.6"/>
    <rect x="30" y="-30" width="12" height="12" fill="#3b82f6" opacity="0.6"/>
    
    <rect x="-30" y="0" width="12" height="12" fill="#3b82f6" opacity="0.6"/>
    <rect x="0" y="0" width="12" height="12" fill="#60a5fa" opacity="0.8"/>
    <rect x="30" y="0" width="12" height="12" fill="#3b82f6" opacity="0.6"/>
    
    <rect x="-30" y="30" width="12" height="12" fill="#3b82f6" opacity="0.6"/>
    <rect x="0" y="30" width="12" height="12" fill="#3b82f6" opacity="0.6"/>
    <rect x="30" y="30" width="12" height="12" fill="#3b82f6" opacity="0.6"/>
  </g>
  
  <!-- Feature text -->
  <text x="600" y="570" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.9">
    URLs • Emails • Phone Numbers • WiFi
  </text>
</svg>
